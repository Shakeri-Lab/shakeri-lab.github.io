name: Deploy to GitHub Pages

# This workflow deliberately uses NO marketplace actions (no actions/checkout,
# actions/setup-node, or peaceiris/actions-gh-pages). GitHub's action-resolution
# service ("Prepare all required actions -> Getting action download info") has
# repeatedly failed with Internal Server Error / Service Unavailable, which kills
# the run before any of our code executes. With zero `uses:` steps there is
# nothing to resolve, so that failure mode cannot occur. Git and Node are already
# installed on the ubuntu-latest runner image.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the pushed commit
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install, type-check, build
        run: |
          npm ci
          npm run check
          npm run build

      - name: Publish to gh-pages
        run: |
          test -f out/index.html || { echo "build produced no out/index.html"; exit 1; }
          touch out/.nojekyll   # keep Pages/Jekyll from stripping the _next/ directory
          cd out
          git init -q .
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
